<script>
document.addEventListener("DOMContentLoaded", function () {
  var links = document.querySelectorAll(".navbar-nav .nav-link");
  var target = null;
  links.forEach(function (a) {
    var t = (a.textContent || "").trim();
    if (t === "EN" || t === "FR") target = a;
  });
  if (!target) return;

  var brand = document.querySelector(".navbar-brand");
  if (!brand) return;

  var rootIdx = new URL(brand.href).pathname.replace(/index\.html$/, "");
  var inFr = /\/fr\/$/.test(rootIdx);
  var here = window.location.pathname.replace(/\/$/, "");
  var rel = here.slice(rootIdx.length);

  var twinDir = inFr ? rootIdx.replace(/\/fr\/$/, "/") : rootIdx + "fr/";
  target.href = twinDir + rel + (window.location.hash || "");
});
</script>
